---

- ansible.builtin.set_fact:
    short_apk_pkg_name: "{{ pkg_name.split('=')[0] }}"
  when: ansible_facts['os_family'] == 'Alpine'
  tags:
    - uninstall_package

- ansible.builtin.set_fact:
    short_deb_pkg_name: "{{ pkg_name.split('=')[0] }}"
  when: ansible_distribution_file_variety == 'Debian'
  tags:
    - uninstall_package

- ansible.builtin.set_fact:
    is_alt_package: "{{ pkg_name | regex_search('^alt-(php|python|ruby|nodejs).*', ignorecase=True) is not none }}"
    is_custom_mysql_package: "{{ pkg_name | regex_search('^cl-(mysql|mariadb).*', ignorecase=True) is not none }}"
    is_ea_apache24_mod_lsapi: "{{ pkg_name.startswith('ea-apache24-mod-lsapi') }}"
    is_ea_apache24_mod_cgid: "{{ pkg_name.startswith('ea-apache24-mod_cgid') }}"
    is_ea_apache24_mod_http2: "{{ pkg_name.startswith('ea-apache24-mod_http2') }}"
    dnf_args: "{{ default_dnf_args | combine(extra_dnf_args) }}"
    force_install: "{{ force_install_pkgs | select('in', pkg_name) | list | length > 0 }}"
    apt_args:
      allow_unauthenticated: true
  vars:
    default_dnf_args:
      allow_downgrade: true
      lock_timeout: 300
    extra_dnf_args: "{{ { 'allowerasing': true } if ansible_facts.distribution_major_version | int >= 8 else {} }}"
  tags:
    - install_package

- name: Ensure that additional packages installed for alt and custom mysql packages
  ansible.builtin.package:
    name:
      - cloudlinux-linksafe
      - cloudlinux-release
    state: present
  ignore_errors: true
  args: "{{ dnf_args if ansible_facts.os_family == 'RedHat' else apt_args}}"
  when:
    - is_alt_package or is_custom_mysql_package
    - ansible_facts.os_family in ('RedHat', 'Debian')
  tags:
    - install_package

- name: Ensure that additional packages installed for alt and custom mysql packages (Alpine)
  ansible.builtin.shell:
    cmd: "apk --allow-untrusted add cloudlinux-linksafe cloudlinux-release"
  ignore_errors: true
  when:
    - is_alt_package or is_custom_mysql_package
    - ansible_facts.os_family == 'Alpine'
  tags:
    - install_package

- name: Ensure that conflicting packages removed for ea-apache24-mod-lsapi CL Ubuntu package
  ansible.builtin.apt:
    name:
      - apache2
      - apache2-bin
      - apache2-data
      - apache2-utils
      - mod-hostinglimits
    state: absent
  when:
    - is_ea_apache24_mod_lsapi
    - dist_name in ('cloudlinux-ubuntu', 'ubuntu')
    - ansible_facts.os_family == 'Debian'
  tags:
    - install_package

- name: Ensure that conflicting packages removed for ea-apache24-mod_cgid RPM package
  ansible.builtin.package:
    name:
      - ea-apache24-mod_cgi
      - ea-apache24-mod_mpm_prefork
    state: absent
  when:
    - is_ea_apache24_mod_cgid
    - ansible_facts.os_family == 'RedHat'
  tags:
    - install_package

- name: Ensure that conflicting packages removed for ea-apache24-mod_http2 RPM package
  ansible.builtin.package:
    name:
      - ea-apache24-mod_mpm_prefork
    state: absent
  when:
    - is_ea_apache24_mod_http2
    - ansible_facts.os_family == 'RedHat'
  tags:
    - install_package


- name: Enable module
  ansible.builtin.shell: dnf module enable -y "{{ module_name }}:{{ module_stream }}:{{ module_version }}"
  when: >
    ansible_facts.os_family == 'RedHat' and
    module_name is defined and module_stream is defined and module_version is defined
  tags:
    - install_package

- name: Downgrade nss packages on EL7
  ansible.builtin.shell:
    cmd: "yum downgrade -y nss*-{{ pkg_version }}"
  when:
    - ansible_facts.os_family == 'RedHat'
    - ansible_facts.distribution_major_version == '7'
    - pkg_name.startswith('nss')
  tags:
    - install_package

- name: Downgrade grub2 packages on EL7
  ansible.builtin.shell:
    cmd: "yum downgrade -y grub2*-{{ pkg_version }}"
  when:
    - ansible_facts.os_family == 'RedHat'
    - ansible_facts.distribution_major_version == '7'
    - pkg_name.startswith('grub2')
  tags:
    - install_package

- name: Install RPM package
  ansible.builtin.package:
    name: "{{ pkg_name }}"
    state: present
  args: "{{ dnf_args }}"
  when:
    - ansible_facts.os_family == 'RedHat'
    - not (force_install | bool)
  tags:
    - install_package

- name: Ensure download utilities are installed
  ansible.builtin.package:
    name: "{{ yum_download_utils_pkg if ansible_facts.distribution_major_version | int <= 7 else dnf_download_utils_pkg }}"
    state: present
  when:
    - ansible_facts.os_family == 'RedHat'
    - force_install | bool
  tags:
    - install_package

- name: Force install RPM package (bypass conflicts)
  when:
    - ansible_facts.os_family == 'RedHat'
    - force_install | bool
  tags:
    - install_package
  block:
    - name: Create temporary directory for forced RPM download
      ansible.builtin.file:
        path: /tmp/force_install
        state: directory

    - name: Download RPM package
      ansible.builtin.shell:
        cmd: >-
          {{ 'yumdownloader --destdir=/tmp/force_install'
          if ansible_facts.distribution_major_version | int <= 7
          else 'dnf download --destdir=/tmp/force_install' }}
          {{ pkg_name }}

    - name: Install downloaded RPM bypassing conflicts
      ansible.builtin.shell:
        cmd: "rpm -i --nodeps --force /tmp/force_install/*.rpm"

    - name: Clean up downloaded RPMs
      ansible.builtin.file:
        path: /tmp/force_install
        state: absent

- name: Install DEB package
  ansible.builtin.apt:
    name: "{{ pkg_name }}"
    state: present
    allow_unauthenticated: true
    install_recommends: no
  when: ansible_distribution_file_variety == 'Debian'
  tags:
    - install_package

- name: Check RPM package is installed
  ansible.builtin.shell:
    cmd: "rpm -q {{ pkg_name }}"
  register: rpm_installed
  failed_when: rpm_installed.rc not in [0, 1]
  when: ansible_facts.os_family == 'RedHat'
  tags:
    - uninstall_package

- name: Uninstall RPM package
  ansible.builtin.shell:
    cmd: "rpm -e --nodeps {{ pkg_name }}"
  register: result
  retries: 30
  delay: 10
  until: result.rc == 0
  when: ansible_facts.os_family == 'RedHat' and rpm_installed.rc == 0
  tags:
    - uninstall_package

- name: Check DEB package is installed
  ansible.builtin.shell:
    cmd: "dpkg-query -Wf '${db:Status-Status} ${Package}\n' {{ short_deb_pkg_name }}"
  register: deb_installed
  failed_when: deb_installed.rc not in [0, 1]
  when: ansible_distribution_file_variety == 'Debian'
  tags:
    - uninstall_package

- name: Uninstall DEB package
  ansible.builtin.shell:
    cmd: "dpkg -r --force-depends {{ short_deb_pkg_name }}"
  register: result
  retries: 30
  delay: 10
  until: result.rc == 0
  when: ansible_distribution_file_variety == 'Debian' and deb_installed.rc == 0
  tags:
    - uninstall_package

- name: Install APK package
  ansible.builtin.shell:
    cmd: "apk --allow-untrusted add {{ pkg_name }}"
  when: ansible_facts.os_family == 'Alpine'
  tags:
    - install_package

- name: Check APK package is installed
  ansible.builtin.shell: "apk --allow-untrusted info -e {{ short_apk_pkg_name }}"
  register: apk_installed
  failed_when: apk_installed.rc not in [0, 1]
  when: ansible_facts.os_family == 'Alpine'
  tags:
    - uninstall_package

- name: Uninstall APK package
  ansible.builtin.shell:
    cmd: "apk --allow-untrusted del {{ pkg_name }}"
  when: ansible_facts.os_family == 'Alpine' and apk_installed.rc == 0
  tags:
    - uninstall_package
