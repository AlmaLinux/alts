---

- name: Initial provision for RPM distributions
  include_tasks:
    file: rhel.yml
  when: ansible_facts.os_family == 'RedHat'
  tags:
    - initial_provision

- name: Initial provision for Debian-like distributions
  include_tasks:
    file: deb.yml
  when: ansible_distribution_file_variety == 'Debian'
  tags:
    - initial_provision

- name: Initial provision for Alpine distributions
  include_tasks:
    file: alpine.yml
  when: ansible_facts.os_family == 'Alpine'
  tags:
    - initial_provision

# SSH client config is only needed where the third-party repo is cloned
# *inside* the environment (VMs cloned over SSH). Docker envs receive the
# repo via `docker cp` from the worker, so they never clone and need no
# SSH config.
- name: Ensure root ~/.ssh directory exists
  file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'
  when:
    - connection_type != 'docker'
    - third_party_repo_ssh_hosts | length > 0
  tags:
    - initial_provision

- name: Configure SSH client for third-party repo hosts
  copy:
    dest: /root/.ssh/config
    owner: root
    group: root
    mode: '0600'
    content: |
      {% for entry in third_party_repo_ssh_hosts %}
      Host {{ entry.host }}
      {% if entry.user is defined %}
          User {{ entry.user }}
      {% endif %}
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
      {% if not loop.last %}

      {% endif %}
      {% endfor %}
  when:
    - connection_type != 'docker'
    - third_party_repo_ssh_hosts | length > 0
  tags:
    - initial_provision

- name: Copy tests to test environment
  copy:
    src: "{{ integrity_tests_dir }}"
    dest: /tests
  when: pytest_is_needed | bool
  tags:
    - initial_provision

- name: Install tools for running tests
  pip:
    name:
      - pytest
      - pytest-testinfra
      - pytest-check
      - pytest-tap
  when: ansible_facts.os_family != 'Alpine' and pytest_is_needed | bool
  tags:
    - initial_provision

- name: Install custom ldconfig
  lineinfile:
    path: /etc/ld.so.conf.d/custom-ts.conf
    line: "{{ item }}"
    create: yes
    owner: root
    group: root
    mode: 0644
  with_items:
    - "/usr/lib64/firefox"
    - "/usr/lib64/thunderbird"
  when: ansible_facts['distribution'] != 'Alpine'
  tags:
    - initial_provision

- name: Reload ldconfig
  shell: ldconfig
  tags:
    - initial_provision
  when: ansible_facts['distribution'] != 'Alpine'


- name: Add custom LD_LIBRARY_PATH for Alpine
  copy:
    dest: /etc/profile.d/custom-libs.sh
    content: |
      export LD_LIBRARY_PATH=/usr/lib/firefox:/usr/lib/thunderbird:$LD_LIBRARY_PATH
    owner: root
    group: root
    mode: 0644
  when: ansible_facts['distribution'] == 'Alpine'
  tags:
    - initial_provision
