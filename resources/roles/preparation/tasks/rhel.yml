---

- name: Initial fact set
  set_fact:
    centos_7_x32: false
    almalinux_docker_x32: false
    bats_package: bats
    final_centos_repo_baseurl: "{{ centos_repo_baseurl }}"

- name: Set fact about CentOS 7 x32 arch
  set_fact:
    centos_7_x32: true
    bats_package: "https://archives.fedoraproject.org/pub/archive/epel/7/x86_64/Packages/b/bats-0.4.0-1.20141016git3b33a5a.el7.noarch.rpm"
    final_centos_repo_baseurl: "{{ centos_repo_baseurl }}/altarch"
    centos_distro_version: "7"
  when: >
    ansible_facts.distribution_major_version == '7' and
    ansible_facts.userspace_architecture in ('i386', 'i486', 'i586', 'i686')

- name: Set fact about AlmaLinux x32 docker container (8 and higher)
  set_fact:
    almalinux_docker_x32: true
  when: >
    connection_type | default('') == 'docker' and
    ansible_facts.distribution == 'AlmaLinux' and
    ansible_facts.distribution_major_version | int >= 8 and
    ansible_facts.userspace_architecture in ('i386', 'i486', 'i586', 'i686')

- name: Set fact about distro version for CentOS 7 x86_64
  set_fact:
    centos_distro_version: "7.9.2009"
  when: "ansible_facts.distribution_major_version == '7' and ansible_facts.userspace_architecture == 'x86_64'"

- name: Re-define procps package name
  set_fact:
    procps_pkg: "procps-ng"
  when: "ansible_facts.os_family == 'RedHat' and ansible_facts.distribution_major_version | int > 6"

- set_fact:
    additional_packages:
      - "{{ bats_package }}"
      - file
      - iproute
      - "{{ procps_pkg }}"

- set_fact:
    pip_packages:
      - python3-pip
      - python3-setuptools
  when: "ansible_facts.os_family == 'RedHat' and ansible_facts.distribution_major_version | int >= 8"

- set_fact:
    pip_packages:
      - python-pip
      - python-setuptools
  when: "ansible_facts.os_family == 'RedHat' and ansible_facts.distribution_major_version | int < 8"

- name: Add os and updates repositories for version 6
  yum_repository:
    name: "centos-6-{{ item }}"
    baseurl: "{{ final_centos_repo_baseurl }}/6.10/{{ item }}/$basearch/"
    description: "CentOS 6 {{ item }} repository"
    enabled: yes
    gpgcheck: yes
    gpgkey: https://vault.centos.org/6.10/os/$basearch/RPM-GPG-KEY-CentOS-6
  with_items:
    - "os"
    - "updates"
  when: >
    ansible_distribution_file_variety in ('RedHat', 'CentOS') and
    ansible_facts.distribution_major_version == '6'

- name: Remove CentOS-Base repository file for version 7
  file:
    path: /etc/yum.repos.d/CentOS-Base.repo
    state: absent

- name: Add os and updates repositories for version 7
  yum_repository:
    name: "centos-7-{{ item }}"
    baseurl: "{{ final_centos_repo_baseurl }}/{{ centos_distro_version }}/{{ item }}/$basearch/"
    description: "CentOS 7 {{ item }} repository"
    enabled: yes
    gpgcheck: yes
    gpgkey: https://vault.centos.org/7.9.2009/os/x86_64/RPM-GPG-KEY-CentOS-7
  with_items:
    - "os"
    - "updates"
  when: >
    ansible_distribution_file_variety in ('RedHat', 'CentOS') and
    ansible_facts.distribution_major_version == '7'

# ini_file's "follow" option needs community.general >= 7.1.0, so resolve
# the symlink (e.g. /etc/yum.conf -> dnf/dnf.conf on EL8+) ourselves
- name: Check whether YUM config is a symlink
  stat:
    path: /etc/yum.conf
  register: yum_conf_stat

- name: Set YUM config real path
  set_fact:
    yum_conf_path: "{{ yum_conf_stat.stat.lnk_source if yum_conf_stat.stat.islnk | default(false) else '/etc/yum.conf' }}"

- name: Add YUM proxy
  ini_file:
    path: "{{ yum_conf_path }}"
    section: main
    option: proxy
    value: "{{ package_proxy }}"
  when: "package_proxy is defined and package_proxy and package_proxy | lower != 'none'"

- name: Remove nodocs param from YUM config
  ini_file:
    path: "{{ yum_conf_path }}"
    section: main
    option: tsflags
    state: absent
  when: cleanup_yum_conf_docs_settings | bool

- name: Remove override_install_langs from YUM config
  ini_file:
    path: "{{ yum_conf_path }}"
    section: main
    option: override_install_langs
    state: absent
  when: cleanup_yum_conf_docs_settings | bool

- name: Delete /etc/rpm/macros.image-language-conf
  file:
    path: /etc/rpm/macros.image-language-conf
    state: absent

# x32 images point their OS repositories at a single host that isn't
# mirrored, while the task repositories provide the same content, so
# provision from the task repositories only
- name: Disable image repositories in AlmaLinux x32 docker container
  command: dnf config-manager --set-disabled '*'
  when: almalinux_docker_x32 | bool and repositories | default([]) | length > 0

- name: Add required repositories in AlmaLinux x32 docker container
  yum_repository:
    name: "{{ item.name }}"
    baseurl: "{{ item.url }}"
    description: "Repository {{ item.name }}"
    enabled: yes
    gpgcheck: no
  with_items: "{{ repositories }}"
  loop_control:
    label: "{{ item.name }}"
  # Build repositories URLs contain credentials
  no_log: true
  when: almalinux_docker_x32 | bool and repositories is defined and (repositories | length > 0)

- name: Install epel-release (8 and higher)
  yum:
    name: epel-release
    state: present
    lock_timeout: 300
  register: pkg_mgr_result
  until: pkg_mgr_retry_done | bool
  retries: "{{ pkg_mgr_retries }}"
  delay: "{{ pkg_mgr_retry_delay }}"
  when: "ansible_facts.os_family == 'RedHat' and ansible_facts.distribution_major_version | int >= 8"

- name: Install epel-release (7 and less)
  yum:
    name: "{{ epel_release_url }}"
    state: present
    lock_timeout: 300
  register: pkg_mgr_result
  until: pkg_mgr_retry_done | bool
  retries: "{{ pkg_mgr_retries }}"
  delay: "{{ pkg_mgr_retry_delay }}"
  when: >
    epel_release_url is defined and
    epel_release_url and
    ansible_facts.os_family == 'RedHat' and
    ansible_facts.distribution_major_version in ('6', '7')

- name: Disable epel on 7 version 32-bit
  shell:
    cmd: yum-config-manager --disable epel
  when: centos_7_x32 | bool

- name: Update all packages
  package:
    name: "*"
    state: latest
    lock_timeout: 300
  register: pkg_mgr_result
  until: pkg_mgr_retry_done | bool
  retries: "{{ pkg_mgr_retries }}"
  delay: "{{ pkg_mgr_retry_delay }}"

- name: Remove CentOS-Base.repo file again (just in case)
  file:
    path: "/etc/yum.repos.d/CentOS-Base.repo"
    state: absent
  when: >
    ansible_distribution_file_variety in ('RedHat', 'CentOS') and
    ansible_facts.distribution_major_version == '7'

- name: Install additional packages
  yum:
    name: "{{ additional_packages + pip_packages }}"
    state: present
    enablerepo: epel
    lock_timeout: 300
  register: pkg_mgr_result
  until: pkg_mgr_retry_done | bool
  retries: "{{ pkg_mgr_retries }}"
  delay: "{{ pkg_mgr_retry_delay }}"
  when: centos_7_x32 | bool is false

- name: Install additional packages on CentOS 7 i686
  yum:
    name: "{{ additional_packages }}"
    state: present
    lock_timeout: 300
  register: pkg_mgr_result
  until: pkg_mgr_retry_done | bool
  retries: "{{ pkg_mgr_retries }}"
  delay: "{{ pkg_mgr_retry_delay }}"
  when: centos_7_x32 | bool

- name: Install ansible
  yum:
    name: ansible
    state: present
    enablerepo: epel
    lock_timeout: 300
  register: pkg_mgr_result
  until: pkg_mgr_retry_done | bool
  retries: "{{ pkg_mgr_retries }}"
  delay: "{{ pkg_mgr_retry_delay }}"
  when: >
    pytest_is_needed | bool and
    (ansible_facts.distribution == 'Fedora' or
     ansible_facts.distribution_major_version | int < 10)
  ignore_errors: "{{ ignore_ansible_install_errors | bool }}"

# EPEL 10 doesn't ship the "ansible" bundle, so use ansible-core
# from AppStream plus the most common collections from EPEL
- name: Install ansible-core and collections (10 and higher)
  yum:
    name:
      - ansible-core
      - ansible-collection-ansible-posix
      - ansible-collection-community-general
    state: present
    enablerepo: epel
    lock_timeout: 300
  register: pkg_mgr_result
  until: pkg_mgr_retry_done | bool
  retries: "{{ pkg_mgr_retries }}"
  delay: "{{ pkg_mgr_retry_delay }}"
  when: >
    pytest_is_needed | bool and
    ansible_facts.distribution != 'Fedora' and
    ansible_facts.distribution_major_version | int >= 10
  ignore_errors: "{{ ignore_ansible_install_errors | bool }}"

- name: Add required repositories
  yum_repository:
    name: "{{ item.name }}"
    baseurl: "{{ item.url }}"
    description: "Repository {{ item.name }}"
    enabled: yes
    gpgcheck: no
  with_items: "{{ repositories }}"
  loop_control:
    label: "{{ item.name }}"
  # Build repositories URLs contain credentials
  no_log: true
  when: not almalinux_docker_x32 | bool and repositories is defined and (repositories | length > 0)
